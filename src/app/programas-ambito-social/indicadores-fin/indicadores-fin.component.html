<div class="position-fixed w-100 bg-white" #planeacion>
    <div
        class="container-fluid px-0 d-flex flex-column flex-md-row flex-lg-row flex-xl-row flex-xxl-row  border-bottom">
        <div id="divOcultarRedes" class="social-icons redesInternas">
            <a class="img-red" target="_blank" [href]="red?.url" *ngFor="let red of redes"><img [src]="red?.img"
                    [alt]="red?.alt" class="iconoRed" /></a>
        </div>
        <span id="divOcultarTitulo" class="w-100 text-center titulo-coneval">{{nombreSistema}}</span>
    </div>
</div>
<div class="m-auto" [ngStyle]="{'padding-top':alto+'px', 'width':'85%','min-height':'90vh'}" id="total" id="padre">


    <div class="row w-100 text-center m-2 mb-2">
        <div class="col-4 col-sm-4 col-md-2" *ngFor="let ciclo of ciclos">
            <button class="btn btn-sm ciclobtn mt-2" 
                [ngClass]="{'cicloSeleccionado': ciclo?.CICLO_VALUE === anioSeleccionado}"
                (click)="seleccionarCiclo(ciclo?.CICLO_VALUE || '')">
                {{ ciclo?.CICLO_VALUE }}
            </button>
        </div>
    </div>

    <div class="row w-50 m-auto mt-2 mb-2">
        <div class="col-sm-12 col-md-6">
            <div class="row align-items-center">
                <div class="col-4 d-flex flex-column">
                    <img src="http://devnet.coneval.org.mx:84/_SIMEPS/img/descarga_excel.jpg" width="50px" class="mb-1">
                    <img src="http://devnet.coneval.org.mx:84/_SIMEPS/img/descarga_csv.jpg" width="50px" class="mb-1">
                </div>
                <div class="col-8 text-center">
                    <span class="descarga">Descargar base histórica de indicadores</span>
                </div>
            </div>
        </div>
        <div class="col-sm-12 col-md-6">
            <div class="row align-items-center">
                <div class="col-4 d-flex flex-column">
                    <img src="http://devnet.coneval.org.mx:84/_SIMEPS/img/descarga_excel.jpg" width="50px" class="mb-1">
                    <img src="http://devnet.coneval.org.mx:84/_SIMEPS/img/descarga_csv.jpg" width="50px" class="mb-1">
                </div>
                <div class="col-8 text-center">
                    <span class="descarga">Descargar base de datos de todos los indicadores</span>
                </div>
            </div>
        </div>
    </div>
    
    <div class="row w-75 m-auto">
        <div class="col-md-4 cuadro d-flex justify-content-center align-items-center" *ngFor="let cuadro of mosaico" 
        [routerLink]="['/listado-fin', cuadro.CICLO,cuadro.RAMO,cuadro.UNIDAD]">
            <img [src]="cuadro?.NOM_ARCHIVO" width="100%" >
        </div>
    </div>
    



    <div *ngIf="this.esTablet" style="height: 145px;"></div>
</div>
